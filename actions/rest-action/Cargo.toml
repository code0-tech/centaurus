[package]
name = "rest-action"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
hercules-sdk = { version = "1.4.5" }
tucana = { version = "0.0.82", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-stream = "0.1"
hyper = "1.8"
hyper-util = "0.1"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
log = "0.4"
env_logger = "0.11"
regex = "1"
percent-encoding = "2.3"
form_urlencoded = "1.2"
base64 = "0.22"
ring = "0.17"
lupus = "0.0.2"
jsonschema = "0.46"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
